map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # uploads: the backend enforces UPLOAD_MAX_MB
    client_max_body_size 0;

    # defaults for every proxied location
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── API gateway ───────────────────────────────────────────
    # Same-origin /api/... is routed to the service that owns the path.
    # The /api prefix is stripped before the request reaches the service.

    # Auth service: sign-up, login, profile, user admin
    location ~ ^/api/(auth|users)(/|$) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://auth:4000;
    }

    # Task/Project service: projects, tasks, comments, attachments, dashboard
    # (also serves /api/health)
    location ~ ^/api/(tasks|projects|comments|attachments|dashboard|health)(/|$) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://tasks:4000;
        proxy_request_buffering off;   # stream large uploads
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Notification service: in-app notifications and LINE account linking
    location ~ ^/api/(notifications|line)(/|$) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://notifications:4000;
    }

    # unknown API paths
    location /api/ {
        default_type application/json;
        return 404 '{"message":"Unknown API route"}';
    }

    # LINE webhook: body passed through untouched (HMAC is over the raw bytes)
    location = /line/webhook {
        proxy_pass http://notifications:4000/line/webhook;
    }

    # Socket.IO (WebSocket upgrade) lives in the Notification service
    location /socket.io/ {
        proxy_pass http://notifications:4000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
